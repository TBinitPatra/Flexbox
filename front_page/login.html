<html>
  <head>
    <title>Login</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Press+Start+2P&display=swap');

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #305862f9;
        background-image: url(LOREGI.png);
        background-size: cover;
        font-family: "Press Start 2P", serif;
      }
      form {
        width: 500px;
        padding: 20px;
        box-shadow: 0 0 30px rgba(20, 26, 25, 0.837);
      }
      input {
        width: 100%;
        margin: 10px 0;
        padding: 10px;
        box-sizing: border-box;
      }

      #loginForm{
        color: rgb(16, 207, 217);
        font-size: large;
      }
      #loginForm input{
        border-top-left-radius: 20px;
        border-top-right-radius: 20px;
      }
    
    </style>
  </head>
  <body>
    <form id="loginForm">
      <marquee behavior="slide" direction="up">
        <h2 style="color: rgb(18, 215, 233); text-align: center;">Login</h2>
      </marquee>
      
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Username" required />
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
      &nbsp;<a href="register.html" style="color: rgb(69, 26, 211);">Go to Register</a>
    </form>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;

          const user = localStorage.getItem(username);

          if (user) {
            const parsedUser = JSON.parse(user);
            if (parsedUser.password === password) {
              localStorage.setItem("user", JSON.stringify(parsedUser));
              window.location.href = "/level_page/level.html";
            } else {
              alert("Incorrect password !!! plz Try again");
            }
          } else {
            alert("User not found");
          }
        });
    </script>
  </body>
</html>
