<html>
  <head>
    <title>Login</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #3b8eb4;
      }
      form {
        width: 500px;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.836);
      }
      input {
        width: 100%;
        margin: 10px 0;
        padding: 10px;
        box-sizing: border-box;
      }

      #loginForm{
        color: rgb(15, 25, 105);
        font-size: large;
      }
    </style>
  </head>
  <body>
    <form id="loginForm">
      <h2 style="color: blue; text-align: center;">Login</h2>
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Username" required />
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
      &nbsp;<a href="register.html">Go to Register</a>
    </form>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;

          const user = localStorage.getItem(username);

          if (user) {
            const parsedUser = JSON.parse(user);
            if (parsedUser.password === password) {
              localStorage.setItem("user", JSON.stringify(parsedUser));
              window.location.href = "/Flexbox_Puzzle_Game-b-u-g-b-o-u-n-t-y/level_page/level.html";
            } else {
              alert("Incorrect password !!! plz Try again");
            }
          } else {
            alert("User not found");
          }
        });
    </script>
  </body>
</html>
